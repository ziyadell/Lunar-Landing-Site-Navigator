<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#05080F" />
    <meta name="description" content="LunaNav, the Lunar Landing Site Navigator by Team AFUQ: Sun and Earth visibility at candidate landing regions near the lunar south pole. NASA Space Apps Challenge 2026 project — not an official NASA product." />
    <meta name="application-name" content="LunaNav" />
    <meta name="author" content="Team AFUQ" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=original-1" />
    <title>LunaNav — Lunar Landing Site Navigator</title>
  </head>
  <body>
    <div id="root">
      <!-- Shown until the app script has loaded and replaced it. -->
      <style>
        body{margin:0;background:#05080f}
        .pre{position:fixed;inset:0;display:grid;place-content:center;justify-items:center;gap:12px;padding:24px;text-align:center;color:#a3afc2;font:14px/1.5 system-ui,sans-serif}
        .pre b{color:#f1f5f9;font-size:18px;font-weight:600}
        .pre i{width:28px;height:28px;border-radius:50%;border:2px solid rgba(77,220,244,.25);border-top-color:#4ddcf4;animation:pre 900ms linear infinite}
        .pre p{margin:0;max-width:34ch}
        @keyframes pre{to{transform:rotate(360deg)}}
      </style>
      <div class="pre" role="status">
        <i aria-hidden="true"></i>
        <b>LunaNav</b>
        <p id="pre-t">Loading the Moon, its terrain and a year of Sun and Earth positions…</p>
      </div>
      <script>
        try { if (JSON.parse(localStorage.getItem('lsn.settings.v2') || '{}').lang === 'ar') { document.documentElement.lang = 'ar'; document.documentElement.dir = 'rtl'; document.getElementById('pre-t').textContent = 'جارٍ تحميل القمر وتضاريسه ومواقع الشمس والأرض لسنة كاملة…'; } } catch (e) {}
      </script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
